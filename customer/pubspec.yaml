name: swift_customer
description: "Swift Customer App — the customer-facing super app for food, groceries, market, shop, pharmacy, laundry, parcel and errand delivery."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^14.6.2
  flutter_animate: ^4.5.2
  shared_preferences: ^2.5.3
  lucide_icons_flutter: ^3.1.14+2
  shimmer: ^3.0.0
  font_awesome_flutter: ^11.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.2
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.2
  flutter_rating_bar: ^4.0.1
  share_plus: ^12.0.1
  uuid: ^4.5.1
  dio: ^5.7.0
  swift_core:
    path: ../packages/swift_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
