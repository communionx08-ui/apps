name: swift_vendor
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  swift_core:
    path: ../packages/swift_core
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  flutter_animate: ^4.5.2
  shared_preferences: ^2.5.3
  intl: ^0.19.0
  uuid: ^4.5.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  connectivity_plus: ^6.1.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  lucide_icons_flutter: ^1.0.0
  url_launcher: ^6.2.6
  share_plus: ^12.0.2
  dio: ^5.7.0
  dio_cache_interceptor: ^3.5.0
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/icons/home/
