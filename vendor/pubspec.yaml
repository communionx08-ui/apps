name: swift_vendor
description: "Swift Vendor App — for vendors and store owners to manage orders, menu, analytics and payouts."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^14.6.2
  flutter_animate: ^4.5.2
  shared_preferences: ^2.5.3
  image_picker: ^1.0.7
  image: ^4.1.7
  camera: ^0.10.5+9
  socket_io_client: ^2.0.3+1
  dio: ^5.4.1
  dotted_border: ^2.1.0
  lottie: ^3.1.0
  swift_core:
    path: ../packages/swift_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
